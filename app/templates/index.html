<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Шашлычное кафе — Главная</title>
    <style>
        :root { --bg:#1b1b1b; --fg:#f5f5f5; --accent:#e0531f; --muted:#a0a0a0; --card:#262626; }
        * { box-sizing: border-box; }
        body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               background: var(--bg); color: var(--fg); line-height: 1.6; }
        header { padding: 60px 20px; text-align: center;
                 background: linear-gradient(135deg,#2a1a12,#1b1b1b); border-bottom: 1px solid #333; }
        header h1 { margin: 0 0 10px; font-size: 2.4rem; }
        header p { color: var(--muted); margin: 0; }
        main { max-width: 1080px; margin: 0 auto; padding: 40px 20px; }
        section { margin-bottom: 60px; }
        h2 { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 8px; }
        .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
        .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid #333; }
        .card h3 { margin-top: 0; }
        .price { color: var(--accent); font-weight: 700; }
        .muted { color: var(--muted); font-size: .9rem; }
        .info-row { display: flex; flex-wrap: wrap; gap: 30px; }
        .info-row > div { flex: 1 1 220px; }
        a { color: var(--accent); }
        footer { text-align:center; padding: 30px; color: var(--muted); font-size: .85rem; }

        /* --- Поиск --- */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1 1 260px;
            padding: 12px 14px;
            font-size: 1rem;
            color: var(--fg);
            background: var(--card);
            border: 1px solid #333;
            border-radius: 8px;
            outline: none;
            transition: border-color .15s;
        }
        .search-bar input:focus { border-color: var(--accent); }
        .search-bar button {
            padding: 12px 18px;
            font-size: 1rem;
            color: var(--fg);
            background: transparent;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color .15s, color .15s;
        }
        .search-bar button:hover { border-color: var(--accent); color: var(--accent); }
        .search-bar button:disabled { opacity: .5; cursor: not-allowed; }

        .empty-state {
            padding: 30px;
            border: 1px dashed #444;
            border-radius: 12px;
            text-align: center;
            color: var(--muted);
        }
        .search-hint { color: var(--muted); font-size: .85rem; margin: 0 0 10px; }
    </style>
</head>
<body>
    <header>
        <h1>🔥 Шашлычное кафе</h1>
        <p>Свежее мясо · Живой уголь · Тёплая компания</p>
    </header>

    <main>
        <section id="contacts">
            <h2>Контакты и местоположение</h2>
            <div class="info-row" id="contacts-row">
                <div><span class="muted">Телефон</span><br><strong id="phone">—</strong></div>
                <div><span class="muted">ВКонтакте</span><br><a id="vk" href="#" target="_blank">—</a></div>
                <div><span class="muted">Адрес</span><br><strong id="address">—</strong></div>
                <div><span class="muted">Часы работы</span><br><strong id="hours">—</strong></div>
            </div>
        </section>

        <section id="policy">
            <h2>Политика</h2>
            <p id="policy-text">Загрузка…</p>
        </section>

        <section id="philosophy">
            <h2>Философия</h2>
            <p id="philosophy-text">Загрузка…</p>
        </section>

        <section id="assortment">
            <h2>Ассортимент</h2>

            <!-- 🔍 Строка поиска -->
            <div class="search-bar">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Поиск по названию, например: шашлык…"
                    autocomplete="off"
                />
                <button type="button" id="search-clear" disabled>Очистить</button>
            </div>
            <p class="search-hint" id="search-hint"></p>

            <div id="products" class="grid"></div>
        </section>
    </main>

    <footer>© Шашлычное кафе · <span id="year"></span></footer>

    <script>
        const api = ""; // тот же origin
        document.getElementById("year").textContent = new Date().getFullYear();

        // ---------- Информация о кафе ----------
        async function loadInfo() {
            const r = await fetch(`${api}/api/info`);
            if (!r.ok) return;
            const d = await r.json();
            document.getElementById("phone").textContent = d.phone || "—";
            const vk = document.getElementById("vk");
            vk.textContent = d.vk_group || "—";
            vk.href = d.vk_group || "#";
            document.getElementById("address").textContent = d.address || "—";
            document.getElementById("hours").textContent = d.working_hours || "—";
            document.getElementById("policy-text").textContent = d.policy || "—";
            document.getElementById("philosophy-text").textContent = d.philosophy || "—";
        }

        // ---------- Ассортимент с поиском ----------
        const searchInput = document.getElementById("search-input");
        const searchClear = document.getElementById("search-clear");
        const searchHint  = document.getElementById("search-hint");
        const productsBox = document.getElementById("products");

        let searchQuery = "";

        function escapeHtml(str) {
            return String(str)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        async function loadProducts() {
            const params = new URLSearchParams();
            if (searchQuery) params.set("search", searchQuery);

            const url = `${api}/api/products` + (params.toString() ? `?${params}` : "");
            const r = await fetch(url);
            if (!r.ok) {
                productsBox.innerHTML =
                    '<div class="empty-state">Не удалось загрузить ассортимент.</div>';
                return;
            }
            const items = await r.json();

            // Подсказка под строкой
            if (searchQuery) {
                searchHint.textContent = `Найдено позиций: ${items.length}`;
            } else {
                searchHint.textContent = "";
            }

            // Рендер карточек
            if (!items.length) {
                productsBox.innerHTML = searchQuery
                    ? `<div class="empty-state">Ничего не найдено по запросу «${escapeHtml(searchQuery)}».</div>`
                    : `<div class="empty-state">Пока нет позиций в меню.</div>`;
                return;
            }

            productsBox.innerHTML = items.map(p => `
                <article class="card">
                    <h3>${escapeHtml(p.name)}</h3>
                    <p class="muted">${escapeHtml(p.description || "")}</p>
                    <p>
                        <span class="price">${p.price} ₽</span>
                        ${p.weight ? `<span class="muted"> · ${p.weight} г</span>` : ""}
                    </p>
                </article>
            `).join("");
        }

        // Debounce, чтобы не отправлять запрос на каждую букву
        function debounce(fn, delay = 300) {
            let t;
            return (...args) => {
                clearTimeout(t);
                t = setTimeout(() => fn(...args), delay);
            };
        }

        const onSearchInput = debounce(() => {
            searchQuery = searchInput.value.trim();
            searchClear.disabled = searchQuery.length === 0;
            loadProducts();
        }, 300);

        searchInput.addEventListener("input", onSearchInput);

        searchInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                searchQuery = searchInput.value.trim();
                searchClear.disabled = searchQuery.length === 0;
                loadProducts();
            }
        });

        searchClear.addEventListener("click", () => {
            searchInput.value = "";
            searchQuery = "";
            searchClear.disabled = true;
            searchHint.textContent = "";
            loadProducts();
            searchInput.focus();
        });

        // ---------- Старт ----------
        loadInfo();
        loadProducts();
    </script>
</body>
</html>
