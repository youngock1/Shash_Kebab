<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель — Кафе</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
<header class="admin-header">
    <h1>☕ Админ-панель</h1>
    <div class="admin-info">
        <span>👤 {{ admin }}</span>
        <a href="{{ url_for('admin_logout') }}" class="logout">Выйти</a>
    </div>
</header>

<div class="shift-bar" id="shift-bar">
    <div id="shift-status">Загрузка...</div>
    <div class="shift-actions">
        <button id="open-shift-btn" class="btn-success">Открыть смену</button>
        <button id="close-shift-btn" class="btn-danger">Закрыть смену</button>
    </div>
</div>

<main class="admin-main">

    <!-- Аналитика -->
    <section class="analytics">
        <h2>📊 Аналитика</h2>
        <div class="stats-grid" id="stats-grid"></div>
        <h3>Топ товаров</h3>
        <table class="top-products" id="top-products">
            <thead>
                <tr><th>Товар</th><th>Кол-во</th><th>Выручка</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <!-- Текущие заказы -->
    <section class="orders">
        <h2>🧾 Текущие заказы</h2>
        <div id="current-orders" class="orders-list"></div>

        <h2>📜 Все заказы</h2>
        <div id="all-orders" class="orders-list"></div>
    </section>

    <!-- Смены -->
    <section class="shifts">
        <h2>🕒 История смен</h2>
        <table class="shifts-table" id="shifts-table">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Открыта</th>
                    <th>Закрыта</th>
                    <th>Админ</th>
                    <th>Заказов</th>
                    <th>Выполнено</th>
                    <th>Отклонено</th>
                    <th>Выручка</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
</main>

<script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
